<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing you in...</title>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>


    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f9f9f9;
            color: #333;
        }
        .box {
            text-align: center;
        }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #0078d4;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin: 15px auto;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Signing you in...</h2>
        <div class="loader"></div>
        <p>Please wait.</p>
    </div>

    <script>
        // SAME msalConfig as main site
        const msalConfig = {
            auth: {
                clientId: "eb328b8a-42d1-48ae-8365-bd2386983e9d",
                authority: "https://login.microsoftonline.com/common",
                redirectUri: "https://learn.microsofts.works/auth"
            },
            cache: {
                cacheLocation: "localStorage",
                storeAuthStateInCookie: true
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        // Handle MSAL Redirect and return user to home page
        msalInstance.handleRedirectPromise()
            .then(() => {
                // after login token processed → return home
                window.location.href = "/";
            })
            .catch((err) => {
                console.error(err);
                document.body.innerHTML =
                    "<h2>Error during sign-in</h2><p>" + err.message + "</p>";
            });
    </script>
</body>
</html>
